name: Manual Build & publish
run-name: 🐳 Build ${{ inputs.service }}:${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of the image"
        required: true
        default: "latest"
      service:
        description: "Service to build"
        required: true
        type: choice
        options:
          - backend
          - frontend
          - service
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🗺️ Resolve build target
        id: target
        run: |
          case "${{ inputs.service }}" in
            service)
              CONTEXT=./microservice
              FILE=./microservice/Dockerfile
              IMAGE=andrewo92/cocktailberry-microservice
              ;;
            backend)
              CONTEXT=./dashboard
              FILE=./dashboard/Dockerfile.backend
              IMAGE=andrewo92/cocktailberry-dashboard-be
              ;;
            frontend)
              CONTEXT=./dashboard
              FILE=./dashboard/Dockerfile.frontend
              IMAGE=andrewo92/cocktailberry-dashboard-fe
              ;;
          esac
          {
            echo "context=$CONTEXT"
            echo "file=$FILE"
            echo "image=$IMAGE"
          } >> "$GITHUB_OUTPUT"

      - name: 🐳 Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🐳 Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🍸 Build and push Docker image CocktailBerry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.target.outputs.context }}
          file: ${{ steps.target.outputs.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.target.outputs.image }}:latest,${{ steps.target.outputs.image }}:${{ inputs.version }}
          # pull keeps base images fresh while still using the layer cache
          pull: true
          cache-from: type=gha,scope=${{ steps.target.outputs.image }}
          cache-to: type=gha,mode=max,scope=${{ steps.target.outputs.image }}
