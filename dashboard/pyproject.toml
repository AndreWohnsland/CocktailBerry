[project]
name = "dashboard"
version = "1.0.0"
description = "CocktailBerry Dashboard"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
]
frontend = [
    "dash>=4.1.0",
    "gunicorn>=26.0.0",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "requests>=2.33.1",
]
